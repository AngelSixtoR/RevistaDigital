<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Stream Analytics</title>
  <desc id="desc">Tres fases consecutivas: ingesta de eventos por Kafka y Event Hubs, procesamiento con Flink y Spark, y salida a dashboards, APIs y almacenamiento.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071b35"/><stop offset="1" stop-color="#122d58"/></linearGradient>
    <linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#08abe4"/><stop offset="1" stop-color="#6276ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".2"/></filter>
  </defs>
  <rect width="860" height="460" rx="25" fill="url(#bg)"/>
  <g fill="none" stroke="#31537c" stroke-opacity=".46"><path d="M0 91H860M0 183H860M0 275H860M0 367H860"/><path d="M100 0V460M250 0V460M400 0V460M550 0V460M700 0V460"/></g>
  <text x="48" y="61" fill="#d7ecff" font-family="Arial,sans-serif" font-size="21" font-weight="bold">De los eventos a las decisiones</text>
  <text x="48" y="89" fill="#89abc8" font-family="Arial,sans-serif" font-size="15">Arquitectura de tres capas · procesamiento continuo</text>
  <g filter="url(#shadow)">
    <rect x="48" y="156" width="220" height="181" rx="18" fill="#f0faff"/>
    <rect x="320" y="156" width="220" height="181" rx="18" fill="#f0faff"/>
    <rect x="592" y="156" width="220" height="181" rx="18" fill="#f0faff"/>
  </g>
  <g fill="url(#grad)"><rect x="48" y="156" width="220" height="12" rx="6"/><rect x="320" y="156" width="220" height="12" rx="6"/><rect x="592" y="156" width="220" height="12" rx="6"/></g>
  <g font-family="Arial,sans-serif" fill="#142c49">
    <text x="73" y="207" font-size="22" font-weight="bold">01. Ingesta</text>
    <text x="345" y="207" font-size="22" font-weight="bold">02. Proceso</text>
    <text x="617" y="207" font-size="22" font-weight="bold">03. Salida</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" fill="#516983">
    <text x="73" y="245">Eventos y brokers</text>
    <text x="73" y="272">Kafka · Event Hubs</text>
    <text x="345" y="245">Cálculo al vuelo</text>
    <text x="345" y="272">Flink · Spark</text>
    <text x="617" y="245">Resultados útiles</text>
    <text x="617" y="272">Tableros · APIs</text>
    <text x="617" y="297">Almacenamiento</text>
  </g>
  <g stroke="#54c7ff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M275 246H311"/><path d="m300 234 12 12 -12 12"/><path d="M548 246H582"/><path d="m571 234 12 12 -12 12"/></g>
  <g font-family="Arial,sans-serif" font-size="14" fill="#c4e7fa"><text x="48" y="394">Fuentes: IoT · transacciones · plataformas digitales</text><text x="48" y="422">Objetivo: baja latencia, resultados correctos y tolerancia a fallos.</text></g>
</svg>